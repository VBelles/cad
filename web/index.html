<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>CAD · Parametric planters</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="workspace">
    <section class="viewer-card" aria-label="Interactive 3D CAD model">
      <div id="viewer" class="three-viewer" aria-label="3D planter viewer">
        <div class="progress">Loading 3D model…</div>
      </div>
    </section>

    <header class="topbar floating-panel">
      <div class="brand-block">
        <span class="eyebrow">VBelles / CAD</span>
        <h1 id="model-title">Parametric planter</h1>
      </div>
      <label class="model-picker">
        <span>Design</span>
        <select id="model-select" aria-label="Planter design"></select>
      </label>
    </header>

    <nav class="actions floating-panel" aria-label="Model downloads">
      <a id="step-link" class="button secondary" href="./downloads/planter.step">STEP</a>
      <a id="glb-link" class="button secondary" href="./models/planter.glb">GLB</a>
      <a class="button" href="https://github.com/VBelles/cad">GitHub</a>
    </nav>

    <div class="viewer-toolbar floating-panel">
      <div class="viewer-toolbar-main">
        <button id="reset-explosion" class="tool-button active" type="button">Assembled</button>
        <button id="explode-all" class="tool-button" type="button">Explode all</button>
      </div>
      <div id="explode-groups" class="explode-groups" aria-label="Explode individual groups"></div>
    </div>

    <div class="viewer-help floating-panel">Drag to orbit · wheel to zoom · click a part to inspect it</div>

    <aside class="info-panel floating-panel" aria-label="Model inspector">
      <div class="inspector-header">
        <div>
          <span class="panel-kicker">Inspector</span>
          <h2>Model data</h2>
        </div>
        <span id="status" class="badge">Loading…</span>
      </div>

      <div class="inspector-scroll">
        <section>
          <h3>Overview</h3>
          <dl id="summary" class="summary"></dl>
        </section>

        <section>
          <h3>Selected part</h3>
          <p id="selected-empty" class="empty-state">Click any visible CAD part.</p>
          <div id="selected-part" class="selected-part" hidden>
            <div class="selected-title-row">
              <div>
                <strong id="selected-name"></strong>
                <span id="selected-id" class="part-id"></span>
              </div>
              <button id="explode-selected" class="mini-button" type="button">Explode part</button>
            </div>
            <dl id="selected-details" class="part-details"></dl>
            <a id="selected-product" class="product-link" target="_blank" rel="noopener" hidden></a>
          </div>
        </section>

        <section>
          <h3>Materials / purchase</h3>
          <div id="products" class="products"></div>
        </section>

        <section>
          <h3>Bill of materials</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Profile</th><th>Cut / size</th><th>Qty</th></tr></thead>
              <tbody id="bom"></tbody>
            </table>
          </div>
        </section>

        <section>
          <h3>Fabrication notes</h3>
          <ul id="notes" class="notes"></ul>
        </section>
      </div>
    </aside>
  </main>
</body>
</html>
