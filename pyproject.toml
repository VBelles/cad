[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vbelles-cad"
version = "0.1.0"
description = "Parametric CAD-as-code workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
    "build123d==0.11.1",
]

[tool.setuptools.packages.find]
include = ["models*"]

[tool.ruff]
line-length = 100
target-version = "py312"
